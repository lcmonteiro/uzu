# CMake CI for uzu, on GCC and Clang.
#
# uzu is header-only and depends on nothing outside the standard library, so there is no package
# step here: checkout, configure, build, test. The build *is* most of the test run -- every
# assertion in tests/ is a static_assert -- so a compile failure in the build step is a failed
# property, and the ctest step confirms each binary was actually produced and ran.
#
# Two jobs:
#
#   format   every tracked C++ file matches .clang-format, checked with the clang-format the
#            repository is formatted with, so a newer one's opinions are not a failure
#   build    on each compiler, in two configurations, both with warnings as errors:
#              release   Release, with the benchmarks built so they cannot rot
#              sanitize  Debug, with AddressSanitizer and UndefinedBehaviorSanitizer on the
#                        tests that run
#
# The builds run on both compilers, which spell the constant-evaluation budget differently
# (-fconstexpr-ops-limit vs -fconstexpr-steps); CMakeLists.txt picks per compiler, and running
# both is what keeps that from silently rotting. MSVC is not in the matrix: it needs
# /constexpr:steps and has not been tried against these fits, so it is left to someone who can
# iterate on a real Windows toolchain rather than guessed at a CI round trip at a time.
#
# The runner is pinned, not ubuntu-latest, so that the compilers and clang-format it ships do not
# change under the repository between one push and the next.
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A newer push to the same branch or pull request makes the run for the older one moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4

    - name: Install clang-format 18
      run: sudo apt-get update && sudo apt-get install -y clang-format-18

    - name: Check formatting
      # --Werror turns each difference into a failure; the diff it would make is in the log.
      run: git ls-files '*.hpp' '*.cpp' '*.h' | xargs clang-format-18 --dry-run --Werror

  build:
    runs-on: ubuntu-24.04

    strategy:
      # Feedback for every combination, not just the first that breaks.
      fail-fast: false

      matrix:
        compiler: [gcc, clang]
        config: [release, sanitize]
        include:
          - compiler: gcc
            c_compiler: gcc
            cpp_compiler: g++
          - compiler: clang
            c_compiler: clang
            cpp_compiler: clang++
          - config: release
            build_type: Release
            options: -DUZU_WARNINGS_AS_ERRORS=ON -DUZU_BUILD_BENCHMARKS=ON
          - config: sanitize
            build_type: Debug
            options: -DUZU_WARNINGS_AS_ERRORS=ON -DUZU_SANITIZE=ON

    name: build (${{ matrix.compiler }}, ${{ matrix.config }})

    steps:
    - uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        ${{ matrix.options }}
        -S ${{ github.workspace }}

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }} --parallel

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # --output-on-failure prints each failing test's full stdout/stderr in the Actions log, so a
      # failure - a sanitizer report included - is debuggable from the CI output alone.
      run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

    - name: Upload test log on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ctest-log-${{ matrix.compiler }}-${{ matrix.config }}
        path: ${{ steps.strings.outputs.build-output-dir }}/Testing/Temporary/LastTest.log
        if-no-files-found: ignore
